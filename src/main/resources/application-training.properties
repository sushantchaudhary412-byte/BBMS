spring.config.activate.on-profile=training

# All required values are supplied only by .env.training.local. There is no DB_URL or
# bbms_local fallback in this profile.
spring.datasource.url=${TRAINING_DB_URL}
spring.datasource.username=${TRAINING_DB_USER}
spring.datasource.password=${TRAINING_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
bbms.training.expected-database=${TRAINING_DB_NAME}
bbms.training.mode=true

# Schema provisioning is an explicit separate operation; normal training startup validates only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=false
spring.liquibase.enabled=false

server.port=${TRAINING_PORT:8082}
server.error.include-message=never
bbms.startup.allow-depleted-inventory-migration=false
bbms.startup.admin-bootstrap=false
bbms.startup.workflow-history-backfill=false
bbms.scheduling.reminders-enabled=false
bbms.training.provision-admin=false
bbms.training.seed=false
