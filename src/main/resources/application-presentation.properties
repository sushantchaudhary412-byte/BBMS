# Required values have no defaults so the presentation profile cannot fall back to bbms_local.
spring.datasource.url=${PRESENTATION_DB_URL}
spring.datasource.username=${PRESENTATION_DB_USER}
spring.datasource.password=${PRESENTATION_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
bbms.presentation.expected-database=${PRESENTATION_DB_NAME}

# This profile validates a pre-provisioned schema and never creates or updates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Keep the presentation process separate from the operational app by default.
server.port=${PRESENTATION_PORT:8081}
