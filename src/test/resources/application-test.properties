# Every Spring integration test uses this disposable in-memory database.
# TestDatabaseSafetyGuard rejects all other URLs before Spring creates the context.
spring.datasource.url=jdbc:h2:mem:bbms_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
bbms.startup.allow-depleted-inventory-migration=false
bbms.startup.admin-bootstrap=false
bbms.startup.workflow-history-backfill=false
bbms.scheduling.reminders-enabled=false
server.error.include-message=never
